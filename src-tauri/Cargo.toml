[package]
name = "xiaxia_publish_assistant"
version = "0.1.0"
description = "虾虾发布助手桌面端"
authors = ["Xiaxia"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
chrono = "0.4"
flate2 = "1"
git2 = { version = "0.20", features = ["vendored-libgit2", "vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
tar = "0.4"
tauri = { version = "2", features = [] }
walkdir = "2"
